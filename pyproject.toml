[project]
name = "missao-em-cortes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.103.1",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.22.0.52",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
painel = [
    "pandas>=3.0.6",
    "streamlit>=1.50",
]

[tool.uv]
# `uv sync` já instala o painel junto (streamlit/pandas). Pra máquina só de
# pipeline: uv sync --no-group painel
default-groups = ["painel"]
