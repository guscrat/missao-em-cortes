# Roda a suíte em todo PR e push pra develop/main. Sem GPU: os testes usam mock
# (nada de whisper/ffmpeg/API real), então ubuntu puro dá conta.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
